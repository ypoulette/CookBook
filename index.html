<!doctype html>
<html lang="fr" class="h-full bg-slate-50 antialiased selection:bg-amber-100 selection:text-amber-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Gestionnaire de recettes intelligent pour PC et iOS : importez depuis le web, personnalisez avec catégories et commentaires, planifiez vos repas de la semaine et générez automatiquement vos listes de courses synchronisées dans le cloud." />

    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="CuisineSync - Recettes & Planificateur" />
